name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff (the only build-time dependency)
        run: pip install "ruff>=0.5"

      - name: Lint
        run: ruff check .

      - name: Run unit tests (stdlib unittest — zero runtime deps)
        run: python -m unittest discover tests -v

      - name: Smoke-test the CLI against the clean fixture
        run: |
          python verify.py tests/fixtures/clean.json
          test $? -eq 0

      - name: Smoke-test the CLI fails on the tampered fixture
        run: |
          set +e
          python verify.py tests/fixtures/tampered.json
          code=$?
          test $code -eq 2

      - name: Smoke-test the CLI fails on the gapped fixture
        run: |
          set +e
          python verify.py tests/fixtures/gapped.json
          code=$?
          test $code -eq 2
